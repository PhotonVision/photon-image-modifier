name: Build driver
on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          # Raspberry Pi and related
          - name: limelight
            script: ./install_limelight.sh
            base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-10-02/2025-10-01-raspios-trixie-arm64-lite.img.xz
          - name: limelight3
            script: ./install_limelight3.sh
            base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-10-02/2025-10-01-raspios-trixie-arm64-lite.img.xz
          - name: limelight3g
            script: ./install_limelight3g.sh
            base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-10-02/2025-10-01-raspios-trixie-arm64-lite.img.xz
          - name: limelight4
            script: ./install_limelight4.sh
            base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-10-02/2025-10-01-raspios-trixie-arm64-lite.img.xz
          - name: raspi
            script: ./install_pi.sh
            base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-10-02/2025-10-01-raspios-trixie-arm64-lite.img.xz
          - name: raspi_dev
            script: ./install_dev_pi.sh
            base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-10-02/2025-10-01-raspios-trixie-arm64-lite.img.xz
          - name: snakeyes
            script: ./install_snakeyes.sh
            base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-10-02/2025-10-01-raspios-trixie-arm64-lite.img.xz
          - name: luma_p1
            script: ./install_luma_p1.sh
            base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-10-02/2025-10-01-raspios-trixie-arm64-lite.img.xz
          # Orange Pi 5 and Rock-5C
          - name: opi5
            script: ./install_opi5_armbian.sh
            base_image: https://github.com/PhotonVision/opi-image-generator/releases/download/v2027.0.0/Armbian-unofficial_26.5.2_Orangepi5_trixie_vendor_6.1.115_minimal.img.xz
            root_location: "partition=1"
            shrink_image: "no"
            use_cache: "no"
          - name: opi5b
            script: ./install_opi5_armbian.sh
            base_image: https://github.com/PhotonVision/opi-image-generator/releases/download/v2027.0.0/Armbian-unofficial_26.5.2_Orangepi5b_trixie_vendor_6.1.115_minimal.img.xz
            root_location: "partition=1"
            shrink_image: "no"
            use_cache: "no"
          - name: opi5plus
            script: ./install_opi5_armbian.sh
            base_image: https://github.com/PhotonVision/opi-image-generator/releases/download/v2027.0.0/Armbian-unofficial_26.5.2_Orangepi5-plus_trixie_vendor_6.1.115_minimal.img.xz
            root_location: "partition=1"
            shrink_image: "no"
            use_cache: "no"
          - name: opi5pro
            script: ./install_opi5_armbian.sh
            base_image: https://github.com/PhotonVision/opi-image-generator/releases/download/v2027.0.0/Armbian-unofficial_26.5.2_Orangepi5pro_trixie_vendor_6.1.115_minimal.img.xz
            root_location: "partition=1"
            shrink_image: "no"
            use_cache: "no"
          - name: opi5max
            script: ./install_opi5_armbian.sh
            base_image: https://github.com/PhotonVision/opi-image-generator/releases/download/v2027.0.0/Armbian-unofficial_26.5.2_Orangepi5-max_trixie_vendor_6.1.115_minimal.img.xz
            root_location: "partition=1"
            shrink_image: "no"
            use_cache: "no"
          - name: rock5c
            script: ./install_opi5_armbian.sh
            base_image: https://github.com/PhotonVision/opi-image-generator/releases/download/v2027.0.0/Armbian-unofficial_26.5.2_Rock-5c_trixie_vendor_6.1.115_minimal.img.xz
            root_location: "partition=1"
            shrink_image: "no"
            use_cache: "no"
          # RubikPi3
          - name: rubikpi3
            script: ./install_rubikpi3.sh
            base_image: https://people.canonical.com/~platform/images/qualcomm-iot/rubikpi3/ubuntu-server-24.04/x03/ubuntu-24.04-preinstalled-server-arm64+rubikpi3-20260305-527.yaml
            root_location: "offset=569376768"
            shrink_image: "no"

    name: "Build for ${{ matrix.name }}"

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Fetch tags
      run: git fetch --tags --force

    - name: Generate version file
      run: |
        # Build the final JSON object
        json_string=$(jq -n \
          --arg date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
          --arg commit_sha "${GITHUB_SHA}" \
          --arg commit_tag "$(git describe --tags --abbrev=0 2>/dev/null || echo "untagged")" \
          --arg image_name "${{ matrix.name }}" \
          --arg image_source "${{ matrix.base_image }}" \
          '{build_date: $date, commit_sha: $commit_sha, commit_tag: $commit_tag, image_name: $image_name, image_source: $image_source}')

        echo "$json_string"

        echo "$json_string" > image-metadata.json

    - name: Install dependencies and build image
      uses: photonvision/photon-image-runner@v2.0.0
      id: install_deps
      env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        minimum_free_mb: 2000
        use_cache: ${{ matrix.use_cache || 'yes' }}
        image_url: ${{ matrix.base_image }}
        root_location: ${{ matrix.root_location || 'partition=2' }}
        shrink_image: ${{ matrix.shrink_image || 'yes' }}
        commands: |
            set -e
            echo "Running ${{ matrix.script }}"
            chmod +x "${{ matrix.script }}"
            "./${{ matrix.script }}"
            echo "Running install_common.sh"
            chmod +x "./install_common.sh"
            "./install_common.sh"

    - name: Zero out bootloader section in opi images
      if: ${{ startsWith(matrix.name, 'opi5') }}
      run: |
        image="${{ steps.install_deps.outputs.image }}"

        # Find partition geometry programmatically - offsets vary between images
        json=$(sudo sfdisk -J "$image")
        sector_size=$(jq -r '.partitiontable.sectorsize // 512' <<<"$json")
        part_start=$(jq -r '[.partitiontable.partitions[].start] | min' <<<"$json")

        # Keep the first 64 sectors (protective MBR + GPT header + entries).
        # U-Boot SPL + U-Boot proper live in the raw sectors between the GPT
        # and the first partition; zeroing them makes the board's SPI U-Boot
        # boot the kernel directly instead of chain-loading and failing.
        gpt_sectors=64
        count=$((part_start - gpt_sectors))

        if [ "$count" -le 0 ]; then
          echo "Refusing to zero: partition 1 starts at sector $part_start (sector size $sector_size)"
          exit 1
        fi

        echo "Partition 1 starts at sector $part_start (sector size ${sector_size}B); zeroing sectors ${gpt_sectors}-$((part_start - 1)) (${count} sectors)"
        sudo dd if=/dev/zero of="$image" bs="$sector_size" seek="$gpt_sectors" count="$count" conv=notrunc
        sudo sync

    - name: Compress built image
      # Compress the standard images
      if: ${{ ! startsWith(matrix.name, 'rubik') }}
      run: |
        sudo mv ${{ steps.install_deps.outputs.image }} photonvision_${{ matrix.name }}.img
        sudo xz -T 0 -v photonvision_${{ matrix.name }}.img
        echo "artifact=photonvision_${{ matrix.name }}.img.xz" >> "$GITHUB_ENV"

    - name: Tar built image
      # Build the RubikPi3-specific tar file
      if: ${{ startsWith(matrix.name, 'rubik') }}
      run: |
        imagedir=$(dirname ${{ steps.install_deps.outputs.image }})
        target=photonvision_${{ matrix.name }}
        tardir=${target}
        mkdir --parents ${tardir}
        echo "Contents of imagedir: ${imagedir}"
        ls -la ${imagedir}
        if ls ${imagedir}/*.tar.gz 1>/dev/null 2>&1; then
          sudo tar -xzf ${imagedir}/*.tar.gz -C ${tardir} --strip-components=1
        fi
        sudo mv ${imagedir}/rawprogram*.xml ${tardir}/ 2>/dev/null || true
        sudo mv ${imagedir}/dtb.bin ${tardir}/ 2>/dev/null || true
        sudo mv ${imagedir}/*.img ${tardir}/ 2>/dev/null || true
        sudo find ${tardir} -mindepth 2 -type f -exec mv {} ${tardir}/ \;
        sudo find ${tardir} -mindepth 1 -type d -empty -delete
        echo "Contents of tardir: ${tardir}"
        ls -la ${tardir}
        sudo tar -I 'xz -T0' --create --file=${target}.tar.xz ${tardir} --checkpoint=10000 --checkpoint-action=echo='%T'
        echo "Contents of tar file:"
        # Expenive operation (has to unzip the file), only use for debugging
        # echo "Contents of tar file:"
        # tar --list --file=${target}.tar.xz
        echo "artifact=${target}.tar.xz" >> "$GITHUB_ENV"

    - uses: actions/upload-artifact@v7
      with:
        archive: false
        path: ${{ env.artifact }}
        if-no-files-found: error
        retention-days: 1

  release:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      # Download literally every single artifact
      - uses: actions/download-artifact@v8
      - run: find
      # Push to dev release and/or to a real release if tagged using semantic versioning
      # See https://github.com/pyTooling/Actions/tree/dev/releaser
      - uses: pyTooling/Actions/releaser@v1.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: 'Dev'
          rm: true
          files: |
            **/*.xz
        if: github.event_name == 'push'
